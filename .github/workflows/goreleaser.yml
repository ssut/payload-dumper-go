name: goreleaser

on:
  push:
    tags:
      - "*"

jobs:
  macos-sdk:
    runs-on: macos-latest
    steps:
      - id: osxcross-macos-sdk
        uses: actions/cache@v6
        with:
          path: osxcross/tarballs
          key: ${{ runner.os }}-osxcross-macos-sdk

      - name: Package MacOSX SDK
        if: steps.osxcross-macos-sdk.outputs.cache-hit != 'true'
        run: |
          git clone https://github.com/tpoechtrager/osxcross osxcross
          pushd osxcross
          XCODEDIR=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -1)
          [ -n "$XCODEDIR" ] || XCODEDIR=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "Using XCODEDIR=$XCODEDIR"
          XCODEDIR=$XCODEDIR tools/gen_sdk_package.sh
          mv MacOSX*.sdk.tar.xz tarballs/
          popd

      - uses: actions/upload-artifact@v7
        with:
          name: osxcross-tarballs
          path: osxcross/tarballs

  goreleaser:
    runs-on: ubuntu-latest
    container: fedora:41
    needs: macos-sdk

    steps:
      - name: Install dependencies
        run: |
          dnf -y install autoconf bash clang cmake gettext-devel git glibc-{devel,static}.{i686,x86_64} golang libstdc++-static libtool libuuid-devel libxml2-devel llvm-devel make mingw{32,64}-{winpthreads,xz-libs}-static mingw{32,64}-gcc{-c++,} openssl-devel patch po4a xz-{devel,static}.{i686,x86_64}
          dnf -y install 'dnf-command(download)'
          dnf download --source xz-devel
          rpm -ivh *.src.rpm
          rm -f *.src.rpm

      - id: xz-version
        run: echo "version=$(basename $HOME/rpmbuild/SOURCES/xz-*.tar.gz .tar.gz)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        with:
          path: |
            /linux-armv7-buildroot/sys-root
            /linux-aarch64-buildroot/sys-root
            /darwin-amd64-buildroot/sys-root
            /darwin-aarch64-buildroot/sys-root
          key: ${{ runner.os }}-buildroots-${{ steps.xz-version.outputs.version }}

      - name: Setup cross compile environment for Linux ARMv7
        env:
          CC: arm-linux-gnueabi-gcc
          CXX: arm-linux-gnueabi-c++
          CFLAGS: -fPIC
        run: |
          dnf -y copr enable lantw44/arm-linux-gnueabi-toolchain
          dnf -y install arm-linux-gnueabi-{binutils,gcc,glibc}
          if [ ! -f /linux-armv7-buildroot/sys-root/lib/liblzma.a ]; then
            mkdir -p /linux-armv7-buildroot
            pushd /linux-armv7-buildroot
            tar -xvf $HOME/rpmbuild/SOURCES/xz-*.tar.gz
            pushd $(basename $HOME/rpmbuild/SOURCES/xz-*.tar.gz .tar.gz)
            ./autogen.sh
            ./configure --host=armv7 --prefix=/linux-armv7-buildroot/sys-root
            make -j$(nproc) install
            popd
            popd
          fi

      - name: Setup cross compile environment for Linux AArch64
        env:
          CC: aarch64-linux-gnu-gcc
          CXX: aarch64-linux-gnu-c++
        run: |
          dnf -y copr enable lantw44/aarch64-linux-gnu-toolchain
          dnf -y install aarch64-linux-gnu-{binutils,gcc,glibc}
          if [ ! -f /linux-aarch64-buildroot/sys-root/lib/liblzma.a ]; then
            mkdir -p /linux-aarch64-buildroot
            pushd /linux-aarch64-buildroot
            tar -xvf $HOME/rpmbuild/SOURCES/xz-*.tar.gz
            pushd $(basename $HOME/rpmbuild/SOURCES/xz-*.tar.gz .tar.gz)
            ./autogen.sh
            ./configure --host=aarch64 --prefix=/linux-aarch64-buildroot/sys-root
            make -j$(nproc) install
            popd
            popd
          fi

      - name: Download osxcross
        run: git clone https://github.com/tpoechtrager/osxcross /osxcross

      - id: osxcross-target
        uses: actions/cache@v6
        with:
          path: /osxcross/target
          key: ${{ runner.os }}-osxcross-target

      - uses: actions/download-artifact@v8
        if: steps.osxcross-target.outputs.cache-hit != 'true'
        with:
          name: osxcross-tarballs
          path: /osxcross/tarballs

      - uses: geekyeggo/delete-artifact@v6
        with:
          name: osxcross-tarballs

      - name: Build osxcross
        if: steps.osxcross-target.outputs.cache-hit != 'true'
        run: |
          SDK_VERSION=$(basename /osxcross/tarballs/MacOSX*.sdk.tar.* | sed -E 's/^MacOSX([0-9]+(\.[0-9]+)?)\.sdk\.tar\..*$/\1/')
          echo "Using SDK_VERSION=$SDK_VERSION"
          UNATTENDED=1 SDK_VERSION=$SDK_VERSION ./build.sh
        working-directory: /osxcross

      - name: Setup cross compile environment for Darwin AMD64
        env:
          CC: o64-clang
          CXX: o64-clang++
        run: |
          if [ ! -f /darwin-amd64-buildroot/sys-root/lib/liblzma.a ]; then
            DARWIN_HOST=$(basename "$(ls /osxcross/target/bin/x86_64-apple-darwin*-ar | head -1)" -ar)
            echo "Using host triple $DARWIN_HOST"
            mkdir -p /darwin-amd64-buildroot
            pushd /darwin-amd64-buildroot
            tar -xvf $HOME/rpmbuild/SOURCES/xz-*.tar.gz
            pushd $(basename $HOME/rpmbuild/SOURCES/xz-*.tar.gz .tar.gz)
            PATH=/osxcross/target/bin:$PATH ./autogen.sh
            PATH=/osxcross/target/bin:$PATH AR=$DARWIN_HOST-ar RANLIB=$DARWIN_HOST-ranlib ./configure --host=$DARWIN_HOST --prefix=/darwin-amd64-buildroot/sys-root --enable-shared=no --disable-xz --disable-xzdec --disable-lzmadec --disable-lzmainfo --disable-scripts --disable-doc
            PATH=/osxcross/target/bin:$PATH make -j$(nproc) install
            popd
            popd
          fi

      - name: Setup cross compile environment for Darwin AArch64
        env:
          CC: oa64-clang
          CXX: oa64-clang++
        run: |
          if [ ! -f /darwin-aarch64-buildroot/sys-root/lib/liblzma.a ]; then
            AR_BIN=$(ls /osxcross/target/bin/aarch64-apple-darwin*-ar 2>/dev/null | head -1)
            [ -n "$AR_BIN" ] || AR_BIN=$(ls /osxcross/target/bin/arm64-apple-darwin*-ar | head -1)
            DARWIN_HOST=$(basename "$AR_BIN" -ar)
            echo "Using host triple $DARWIN_HOST"
            mkdir -p /darwin-aarch64-buildroot
            pushd /darwin-aarch64-buildroot
            tar -xvf $HOME/rpmbuild/SOURCES/xz-*.tar.gz
            pushd $(basename $HOME/rpmbuild/SOURCES/xz-*.tar.gz .tar.gz)
            PATH=/osxcross/target/bin:$PATH ./autogen.sh
            PATH=/osxcross/target/bin:$PATH AR=$DARWIN_HOST-ar RANLIB=$DARWIN_HOST-ranlib ./configure --host=$DARWIN_HOST --prefix=/darwin-aarch64-buildroot/sys-root --enable-shared=no --disable-xz --disable-xzdec --disable-lzmadec --disable-lzmainfo --disable-scripts --disable-doc
            PATH=/osxcross/target/bin:$PATH make -j$(nproc) install
            popd
            popd
          fi

      - uses: actions/checkout@v7

      - name: Add $GITHUB_WORKSPACE to git safe.directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - uses: actions/cache@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - uses: goreleaser/goreleaser-action@v7
        with:
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
