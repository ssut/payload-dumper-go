name: goreleaser

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  macos-sdk:
    runs-on: macos-latest
    steps:
      - id: cache-sdk
        uses: actions/cache@v4
        with:
          path: osxcross/tarballs
          key: ${{ runner.os }}-osxcross-macos-sdk

      - name: Package MacOSX SDK
        if: steps.cache-sdk.outputs.cache-hit != 'true'
        run: |
          git clone https://github.com/tpoechtrager/osxcross osxcross
          cd osxcross
          XCODEDIR=/Applications/Xcode_16.0.app tools/gen_sdk_package.sh
          mv MacOSX*.sdk.tar.xz tarballs/

      - uses: actions/upload-artifact@v4
        with:
          name: osxcross-tarballs
          path: osxcross/tarballs

  goreleaser:
    runs-on: ubuntu-latest
    container: fedora:41
    needs: macos-sdk
    steps:
      - name: Install base dependencies
        run: |
          dnf -y install autoconf bash clang cmake gettext-devel git \
            glibc-{devel,static}.{i686,x86_64} libstdc++-static libtool \
            libuuid-devel libxml2-devel llvm-devel make \
            mingw{32,64}-{winpthreads,xz-libs}-static mingw{32,64}-gcc{-c++,} \
            openssl-devel patch po4a xz-{devel,static}.{i686,x86_64}
          dnf -y install 'dnf-command(download)'
          dnf download --source xz-devel
          rpm -ivh *.src.rpm
          rm -f *.src.rpm

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'

      - name: Setup cross compile for Linux ARMv7
        env:
          CC: arm-linux-gnueabi-gcc
          CXX: arm-linux-gnueabi-c++
          CFLAGS: -fPIC
        run: |
          dnf -y copr enable lantw44/arm-linux-gnueabi-toolchain
          dnf -y install arm-linux-gnueabi-{binutils,gcc,glibc}
          mkdir /linux-armv7-buildroot
          cd /linux-armv7-buildroot
          tar -xvf $HOME/rpmbuild/SOURCES/xz-*.tar.gz
          cd $(basename $HOME/rpmbuild/SOURCES/xz-*.tar.gz .tar.gz)
          ./autogen.sh
          ./configure --host=armv7 --prefix=/linux-armv7-buildroot/sys-root
          make -j$(nproc) install

      - name: Setup cross compile for Linux AArch64
        env:
          CC: aarch64-linux-gnu-gcc
          CXX: aarch64-linux-gnu-c++
        run: |
          dnf -y copr enable lantw44/aarch64-linux-gnu-toolchain
          dnf -y install aarch64-linux-gnu-{binutils,gcc,glibc}
          mkdir /linux-aarch64-buildroot
          cd /linux-aarch64-buildroot
          tar -xvf $HOME/rpmbuild/SOURCES/xz-*.tar.gz
          cd $(basename $HOME/rpmbuild/SOURCES/xz-*.tar.gz .tar.gz)
          ./autogen.sh
          ./configure --host=aarch64 --prefix=/linux-aarch64-buildroot/sys-root
          make -j$(nproc) install

      - name: Download osxcross
        run: git clone https://github.com/tpoechtrager/osxcross /osxcross

      - id: cache-osxcross-target
        uses: actions/cache@v4
        with:
          path: /osxcross/target
          key: ${{ runner.os }}-osxcross-target

      - uses: actions/download-artifact@v4
        if: steps.cache-osxcross-target.outputs.cache-hit != 'true'
        with:
          name: osxcross-tarballs
          path: /osxcross/tarballs

      - uses: geekyeggo/delete-artifact@v5
        with:
          name: osxcross-tarballs

      - name: Build osxcross
        if: steps.cache-osxcross-target.outputs.cache-hit != 'true'
        run: UNATTENDED=1 SDK_VERSION=15.0 ./build.sh
        working-directory: /osxcross

      - name: Setup cross compile for Darwin AMD64
        env:
          CC: o64-clang
          CXX: o64-clang++
        run: |
          mkdir /darwin-amd64-buildroot
          cd /darwin-amd64-buildroot
          tar -xvf $HOME/rpmbuild/SOURCES/xz-*.tar.gz
          cd $(basename $HOME/rpmbuild/SOURCES/xz-*.tar.gz .tar.gz)
          PATH=/osxcross/target/bin:$PATH ./autogen.sh
          PATH=/osxcross/target/bin:$PATH ./configure --host=x86_64-apple-darwin24 --prefix=/darwin-amd64-buildroot/sys-root --enable-shared=no
          PATH=/osxcross/target/bin:$PATH make -j$(nproc) install

      - name: Setup cross compile for Darwin AArch64
        env:
          CC: oa64-clang
          CXX: oa64-clang++
        run: |
          mkdir /darwin-aarch64-buildroot
          cd /darwin-aarch64-buildroot
          tar -xvf $HOME/rpmbuild/SOURCES/xz-*.tar.gz
          cd $(basename $HOME/rpmbuild/SOURCES/xz-*.tar.gz .tar.gz)
          PATH=/osxcross/target/bin:$PATH ./autogen.sh
          PATH=/osxcross/target/bin:$PATH ./configure --host=aarch64-apple-darwin24 --prefix=/darwin-aarch64-buildroot/sys-root --enable-shared=no
          PATH=/osxcross/target/bin:$PATH make -j$(nproc) install

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add $GITHUB_WORKSPACE to git safe.directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Set cross-compile environment variables
        run: |
          echo "PATH=/osxcross/target/bin:$PATH" >> $GITHUB_ENV
          echo "CGO_ENABLED=1" >> $GITHUB_ENV
          # Linux ARMv7
          echo "CC_armv7_linux_gnueabi=arm-linux-gnueabi-gcc" >> $GITHUB_ENV
          echo "CXX_armv7_linux_gnueabi=arm-linux-gnueabi-c++" >> $GITHUB_ENV
          echo "PKG_CONFIG_PATH_armv7_linux_gnueabi=/linux-armv7-buildroot/sys-root/lib/pkgconfig" >> $GITHUB_ENV
          # Linux AArch64
          echo "CC_aarch64_linux_gnu=aarch64-linux-gnu-gcc" >> $GITHUB_ENV
          echo "CXX_aarch64_linux_gnu=aarch64-linux-gnu-c++" >> $GITHUB_ENV
          echo "PKG_CONFIG_PATH_aarch64_linux_gnu=/linux-aarch64-buildroot/sys-root/lib/pkgconfig" >> $GITHUB_ENV
          # Darwin AMD64
          echo "CC_x86_64_darwin=o64-clang" >> $GITHUB_ENV
          echo "CXX_x86_64_darwin=o64-clang++" >> $GITHUB_ENV
          echo "PKG_CONFIG_PATH_x86_64_darwin=/darwin-amd64-buildroot/sys-root/lib/pkgconfig" >> $GITHUB_ENV
          # Darwin AArch64
          echo "CC_aarch64_darwin=oa64-clang" >> $GITHUB_ENV
          echo "CXX_aarch64_darwin=oa64-clang++" >> $GITHUB_ENV
          echo "PKG_CONFIG_PATH_aarch64_darwin=/darwin-aarch64-buildroot/sys-root/lib/pkgconfig" >> $GITHUB_ENV

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
